<!-- Update recovery. Standalone on purpose: no app imports, never served from the
     worker's cache, and it never touches saved games (localStorage). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff4d6">
<title>Update Penny Tableau</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { background: #1f7f7c; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    font: 16px/1.45 Georgia, 'Times New Roman', serif; color: #2b1b17;
  }
  main { width: min(420px, 100%); background: #fffaf0; border: 2px solid #2b1b17; border-radius: 16px; box-shadow: 0 6px 0 #2b1b17; padding: 20px 18px; text-align: center; }
  h1 { margin: 0 0 8px; font-size: 24px; }
  p { margin: 0 0 12px; }
  #status { min-height: 3em; font-style: italic; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  button, a.btn { font: inherit; font-weight: 700; min-height: 44px; padding: 0 16px; border-radius: 22px; border: 2px solid #2b1b17; background: #f7edd6; color: inherit; text-decoration: none; display: inline-flex; align-items: center; cursor: pointer; box-shadow: 0 3px 0 #2b1b17; }
  button.main { background: #d5362d; color: #f7edd6; }
  button:disabled { opacity: .6; cursor: default; }
  small { display: block; margin-top: 14px; color: #5e3a20; }
</style>
</head>
<body>
<main>
  <h1>Update Penny Tableau</h1>
  <p id="status">Checking for a new version…</p>
  <div class="row">
    <button class="main" id="check" disabled>Check again</button>
    <a class="btn" href="./">Open the game</a>
  </div>
  <p style="margin-top:14px"><button id="repair">Repair app files</button></p>
  <small>Your saved games are kept. Repair removes only Penny Tableau's cached app files and downloads them again.</small>
</main>
<script>
(() => {
  const status = document.getElementById('status');
  const check = document.getElementById('check');
  const repair = document.getElementById('repair');
  const say = (t) => { status.textContent = t; };
  const scopePath = new URL('./', location.href).pathname;
  const prefix = 'penny-tableau@' + scopePath + ':';
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  function installed(worker) {
    return new Promise((resolve, reject) => {
      if (worker.state === 'installed' || worker.state === 'activated') return resolve();
      worker.addEventListener('statechange', () => {
        if (worker.state === 'installed' || worker.state === 'activated') resolve();
        if (worker.state === 'redundant') reject(new Error('The new version failed to install.'));
      });
    });
  }

  function activate(worker) {
    return new Promise((resolve, reject) => {
      if (!navigator.serviceWorker.controller) return resolve();
      const t = setTimeout(() => reject(new Error('The new version did not take over in time.')), 15000);
      navigator.serviceWorker.addEventListener('controllerchange', () => { clearTimeout(t); resolve(); }, { once: true });
      worker.postMessage({ type: 'activate' });
    });
  }

  async function run() {
    check.disabled = true;
    try {
      if (!('serviceWorker' in navigator)) { say('This browser does not install app files. The game always loads fresh.'); return; }
      const reg = await navigator.serviceWorker.register('./sw.js', { scope: './', updateViaCache: 'none' });
      say('Checking for a new version…');
      await reg.update();
      const next = reg.installing || reg.waiting;
      if (!next) { say('You have the latest version.'); return; }
      say('Downloading the new version…');
      await Promise.race([installed(next), wait(30000).then(() => { throw new Error('The download is taking too long.'); })]);
      say('Switching to the new version…');
      await activate(reg.waiting || next);
      say('Updated. Opening the game…');
      await wait(600);
      location.replace('./');
    } catch (err) {
      say((err && err.message ? err.message : 'Something went wrong.') + ' Check your connection and try again, or repair the app files.');
    } finally {
      check.disabled = false;
    }
  }

  async function repairFiles() {
    repair.disabled = true;
    try {
      say('Removing cached app files…');
      for (const key of await caches.keys()) if (key.startsWith(prefix)) await caches.delete(key);
      const reg = await navigator.serviceWorker.getRegistration('./');
      if (reg) await reg.unregister();
      say('Downloading the game again…');
      await wait(400);
      location.replace('./');
    } catch (err) {
      say('Repair failed: ' + (err && err.message ? err.message : err) + '. Try again.');
      repair.disabled = false;
    }
  }

  check.addEventListener('click', run);
  repair.addEventListener('click', repairFiles);
  run();
})();
</script>
</body>
</html>
